sonarqube-check-backend:
  stage: check
  image: docker.m.ixdev.cn/library/maven:3-eclipse-temurin-17
  tags:
    - maven
  before_script:
    - echo "=========================== CHANGE MAVEN MIRROR ============================"
    - mkdir -p $HOME/.m2 || true
    - echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
      <localRepository>/cache/.m2</localRepository>
      <mirrors>
      <mirror>
      <id>nexus-aliyun</id>
      <mirrorOf>*</mirrorOf>
      <name>Nexus aliyun</name>
      <url>https://mirrors.gdut.edu.cn/nexus/repository/maven-public/</url>
      </mirror>
      </mirrors>
      </settings>' > $HOME/.m2/settings.xml || true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests -Dmaven.repo.local=cache -f server/pom.xml
  allow_failure: true
  only:
    - dev

package-build:dev:
  image: docker.m.ixdev.cn/library/maven:3.9-eclipse-temurin-17
  stage: package-build
  tags:
    - dev
  before_script:
    - echo "============================ CHANGE APT MIRROR ============================="
    - sed -i 's/http:\/\/archive.ubuntu.com/http:\/\/mirrors.gdut.edu.cn/g' /etc/apt/sources.list.d/ubuntu.sources
    - sed -i 's/http:\/\/security.ubuntu.com/http:\/\/mirrors.gdut.edu.cn/g' /etc/apt/sources.list.d/ubuntu.sources
    - echo "======================== INSTALL REQUIRED TOOLS ============================"
    - apt update -y
    - apt install -y --no-install-recommends ca-certificates curl wget git gnupg2 software-properties-common
    - echo "=========================== CHANGE MAVEN MIRROR ============================"
    - mkdir -p $HOME/.m2 || true
    - echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
      <localRepository>/cache/.m2</localRepository>
      <mirrors>
      <mirror>
      <id>nexus-aliyun</id>
      <mirrorOf>*</mirrorOf>
      <name>Nexus aliyun</name>
      <url>https://mirrors.gdut.edu.cn/nexus/repository/maven-public/</url>
      </mirror>
      </mirrors>
      </settings>' > $HOME/.m2/settings.xml || true
    - echo "=========================== INSTALL NODE.JS ================================"
    - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    - apt-get install -y nodejs
    - echo "========================= CONFIGURE NPM REGISTRY ==========================="
    - npm config set registry https://mirrors.gdut.edu.cn/nexus/repository/npm
    - echo "============================== INSTALL PNPM ================================"
    - npm install -g pnpm
    - echo "========================= CONFIGURE PNPM REGISTRY =========================="
    - pnpm config set registry https://mirrors.gdut.edu.cn/nexus/repository/npm
  script:
    - echo "=========================== INSTALL DEPENDENCIES ============================"
    - cd frontend
    - pnpm install
    - echo "============================= BUILD FRONTEND ================================"
    - pnpm run build
    - cd ..
    - echo "========================== COPY FRONTEND RESOURCES =========================="
    - mkdir -p server/src/main/resources/static
    - cp -r frontend/dist/* server/src/main/resources/static/
    - echo "========================== GENERATE VERSION TAGS ==========================="
    - export VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f server/pom.xml)
    # - export VERSION=v$VERSION
    - echo "Building version $VERSION"
    - echo "=========================== BUILD MAVEN PROJECT ============================"
    - mvn clean package -f server/pom.xml -Dmaven.test.sktip=true -DskipTests -Dmaven.repo.local=cache
    - echo "=========================== EXPORT VERSION TAGS ============================"
    - echo "VERSION=$VERSION" >> build.env
    - echo "============================= EXPORT JAR FILE =============================="
  artifacts:
    paths:
      - server/target/*.jar
    expire_in: 30 min
    reports:
      dotenv: build.env
  only:
    - dev

