docker-build-and-push:
  image: docker.m.ixdev.cn/library/docker:24-cli
  stage: image-build
  tags:
    - Docker
  services:
    - name: docker.m.ixdev.cn/library/docker:24-cli
  before_script:
    - echo "======================== SETUP BUILDX ENVIRONMENT =========================="
    - docker info
    - sed -i 's#https\?://dl-cdn.alpinelinux.org/alpine#https://mirrors.cernet.edu.cn/alpine#g' /etc/apk/repositories
    - apk update
    - apk add --no-cache git
    # 创建并使用 buildx builder
    - docker buildx create --use --name multiarch-builder --driver docker-container --platform linux/amd64,linux/arm64,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x,linux/mips64le --bootstrap || docker buildx use multiarch-builder
    - docker buildx inspect --bootstrap
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "VERSION=$VERSION"
    - echo "============================= LOGIN TO HARBOR =============================="
    - docker login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "======================= BUILD AND PUSH DOCKER IMAGES ======================="
    - cd server
    - sed -i "s/FROM eclipse-temurin:17-jre/FROM registry.gdut.edu.cn\/docker\/library\/eclipse-temurin:17-jre/g" Dockerfile
    - |
      docker buildx build \
      --platform linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x \
      --tag ${HARBORHOST}/certvault/certvault:${VERSION} \
      --tag ${HARBORHOST}/certvault/certvault:latest \
      --push \
      .
    - echo "============================ EXPORT IMAGE TAGS ============================="
    - echo "VERSION=$VERSION" >> build.env
  after_script:
    - echo "============================ CLEAN BUILD CACHE ============================="
    - docker buildx prune -a -f
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 30 min
  only:
    - dev

helm-build:
  image: docker.m.ixdev.cn/dtzar/helm-kubectl:3.8.0
  stage: image-build
  tags:
    - dev
  before_script:
    # 配置 Helm 和 Kubernetes
    - export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
    - echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG
    - helm repo add stable https://charts.helm.sh/stable
    - helm repo update
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "VERSION=$VERSION"
    - echo "============================ GO TO HELM DIRECTORY =========================="
    - cd server/helm/charts
    - echo "=============================== UPDATE VERSION ============================="
    - sed -i "s/@project.version@/${VERSION}/g" cert-vault/README.md
    - 'sed -i "s/version: 0.0.0/version: ${VERSION}/" cert-vault/Chart.yaml'
    - 'sed -i "s/appVersion: .*/appVersion: \"${VERSION}\"/" cert-vault/Chart.yaml'
    - echo "============================= LOGIN TO HARBOR =============================="
    - helm registry login ${HARBORHOST} --username ${USERNAME} --password ${PASSWORD}
    - echo "============================== PACKAGE CHART ==============================="
    - 'sed -i "s/name: cert-vault/name: certvault-helm/g" cert-vault/Chart.yaml'
    - helm package cert-vault --version ${VERSION}
    - echo "=============================== PUSH CHARTS ================================"
    - helm push certvault-helm-* oci://${HARBORHOST}/certvault
  artifacts:
    reports:
      dotenv: build.env
  only:
    - dev

release-new-version:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  tags:
    - dev
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "VERSION=$VERSION"
  release:
    tag_name: "${VERSION}"
    description: "This is a release of version ${VERSION}."
  allow_failure: true
  only:
    - main

image-sign:
  image: docker.m.ixdev.cn/library/ubuntu:22.04
  stage: signing
  tags:
    - dev
  before_script:
    - echo "============================ CHANGE APT MIRROR ============================="
    - sed -i 's/http:\/\/archive.ubuntu.com/http:\/\/mirrors.gdut.edu.cn/g' /etc/apt/sources.list
    - sed -i 's/http:\/\/security.ubuntu.com/http:\/\/mirrors.gdut.edu.cn/g' /etc/apt/sources.list
    - apt update -y
    - echo "======================== INSTALL REQUIRED TOOLS ============================"
    - apt install curl jq skopeo -y
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "VERSION=$VERSION"
    - echo "============================== INSTALL COSIGN =============================="
    - curl -fL -o cosign_1.6.0_amd64.deb --insecure "https://cn-gz-1.minio.gdutnic.com/gdutnic/public/cosign_1.6.0_amd64.deb"
    - dpkg -i cosign_1.6.0_amd64.deb
    - mv /usr/local/bin/cosign-linux-amd64 /usr/local/bin/cosign
    - echo "=============================== KEY GENERATE ==============================="
    - export COSIGN_PASSWORD=$PASSWORD
    - cosign generate-key-pair
    - echo "============================= LOGIN TO HARBOR =============================="
    - cosign login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "==================== EXTRACT ARCHITECTURE DIGESTS ========================="
    # 使用 skopeo 获取镜像 manifest 信息
    - |
      echo "Fetching manifest for ${HARBORHOST}/certvault/certvault:latest"
      skopeo inspect --raw docker://${HARBORHOST}/certvault/certvault:latest > manifest.json
      
      # 解析 manifest，提取每个架构的 digest
      cat manifest.json | jq -r '
        if .manifests then
          .manifests[] | "\(.platform.architecture):\(.digest)"
        else
          "single-arch:\(.config.digest // "unknown")"
        end
      ' > arch_digests.txt
      
      echo "Architecture digests:"
      cat arch_digests.txt
    - echo "===================== SIGN EACH ARCHITECTURE IMAGE ========================"
    # 签名 manifest list (整体镜像)
    - echo "Signing manifest list for latest tag..."
    - cosign sign --key cosign.key ${HARBORHOST}/certvault/certvault:latest
    # 签名每个架构的镜像
    - |
      echo "Signing individual architecture images..."
      while IFS=: read -r arch digest; do
        if [ "$arch" != "single-arch" ] && [ -n "$digest" ]; then
          echo "Signing $arch architecture with digest: $digest"
          cosign sign --key cosign.key ${HARBORHOST}/certvault/certvault@${digest}
        else
          echo "Skipping single-arch or empty digest"
        fi
      done < arch_digests.txt
    - echo "================================ CHART SIGN ================================"
    - cosign sign --key cosign.key $HARBORHOST/certvault/certvault-helm:${VERSION}
    - echo "========================== FIX FILE PERMISSIONS ============================"
    - chmod 644 cosign.key cosign.pub
    - ls -la cosign.*
    - echo "================================ EXPORT KEY ================================"
    - echo "The Password of the key is Harbor account's password, the key will reserved for 30 minutes."
    - echo "VERSION=$VERSION" >> build.env
  artifacts:
    paths:
      - cosign.key
      - cosign.pub
      - arch_digests.txt
      - arch_digests_versioned.txt
      - manifest.json
      - manifest_versioned.json
    reports:
      dotenv: build.env
    expire_in: 30 min
  only:
    - dev

helm-deploy:
  stage: deploy
  image: docker.m.ixdev.cn/dtzar/helm-kubectl:3.8.0
  tags:
    - dev
  before_script:
    # 配置 Helm 和 Kubernetes
    - export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
    - echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG
    - helm repo add stable https://charts.helm.sh/stable
    - helm repo update
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "VERSION=$VERSION"
    - echo "============================= LOGIN TO HARBOR =============================="
    - helm registry login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "============================= PULL NEW IMAGE ==============================="
    - helm pull oci://${HARBORHOST}/certvault/certvault-helm --version ${VERSION} --untar
    - echo "======================== LOAD HELM CONFIGURATION ==========================="
    - echo ${VALUES_BASE64} | base64 -d > custom.yaml
    - echo "=========================== DEPLOY NEW VERSION ============================="
    - helm -n cert-vault upgrade --install cert-vault oci://${HARBORHOST}/certvault/certvault-helm --version ${VERSION} --values custom.yaml --debug
  only:
    - dev